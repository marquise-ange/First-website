<form action="" method="post">
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
    </div>

    <br>
    <br>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <br>
    <br>

    <div>
        <label for="phone number">Phone Number:</label>
        <input type="tel" id="phone number" name="phone number" required>
    </div>

    <br>

    <div>
        <label for="subject-category">Subject Category:</label>
        <select id="subject-category" name="subject-category" required>
            <option value="">Select a category</option>
            <option value="customer-support">customer support</option>
            <option value="sales">Sales inquiries</option>
            <option value="general">General inquiry</option>
        </select>
    </div>
    <br>

    <fieldset>
        <legend>Preferred Contact Method:</legend>
        <div>
            <input type="radio" id="contact-email" name="contact-method" value="email" required>
            <label for="contact-email">Email</label>
        </div>
        <div>
            <input type="radio" id="contact-phone" name="contact-method" value="phone">
            <label for="contact-phone">Phone</label>
        </div>

</form>
<div>
    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="4" cols="50" required></textarea>

</div>

<br>
<br>

<button type="submit">Submit Form</button>
<button type="reset-form">Reset Form</button>
